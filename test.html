<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 호버 효과</title>
    <style>
        /* 이미지를 감싸는 컨테이너 박스 */
        .image-container {
            position: relative;
            width: 300px; /* 원하는 이미지 가로 크기 */
            height: 200px; /* 원하는 이미지 세로 크기 */
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* 이미지 스타일 */
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 이미지가 비율에 맞게 꽉 차도록 설정 */
            display: block;
        }

        /* 마우스를 올렸을 때 나타날 하얀색 박스 */
        .white-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.85); /* 흰색 배경 + 85% 반투명 효과 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* 처음에는 보이지 않도록 설정 */
            opacity: 0; 
            transition: opacity 0.3s ease; /* 부드럽게 나타나는 효과 (0.3초) */
            
            color: #333; /* 텍스트 색상 */
            padding: 20px;
            box-sizing: border-box;
        }

        /* 컨테이너에 마우스를 올리면(Hover) 흰색 박스를 보이게 함 */
        .image-container:hover .white-box {
            opacity: 1;
        }
        
        /* 흰색 박스 안의 텍스트 스타일 정의 */
        .white-box h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }
        .white-box p {
            margin: 0;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 이미지 카드 시작 -->
    <div class="image-container">
        <!-- 배경이 될 이미지 경로 입력 -->
        <img src="https://picsum.photos" alt="샘플 이미지">
        
        <!-- 마우스 올렸을 때 나오는 흰색 박스 영역 -->
        <div class="white-box">
            <h3>이미지 제목</h3>
            <p>마우스를 올리면 나타나는 설명글입니다.</p>
        </div>
    </div>
    <!-- 이미지 카드 끝 -->

</body>
</html>
